name: Daily Player Cards Generation

on:
  schedule:
    # Runs everyday at 13:00 UTC (15:00 Prague Time during Summer / 14:00 in Winter)
    - cron: '0 13 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions UI tab anytime

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create credentials.json from Secret
        run: |
          cat > credentials.json <<'EOF'
          ${{ secrets.CREDENTIALS_JSON }}
          EOF

      - name: Run Cards Pipeline
        run: |
          python "back cards update.py"

      - name: Clean up Credentials
        if: always()
        run: |
          rm -f credentials.json

      - name: Commit and Push Updated Cards
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage all generated PNG images in the output folder
          git add output/player_cards/*.png
          
          # Check if there are actual updates to commit
          if git diff --staged --quiet; then
            echo "No new player cards generated. Skipping commit."
          else
            git commit -m "Auto-update player cards via GitHub Actions - $(date +'%Y-%m-%d %H:%M')"
            git push origin main
          fi
